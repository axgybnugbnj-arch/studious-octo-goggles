<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020702">
<title>درع أبو صالح</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #020702;
    color: #00ff66;
    font-family: Arial, sans-serif;
    text-align: center;
}
.box {
    max-width: 500px;
    margin: 40px auto;
    padding: 25px;
    border: 2px solid #00ff66;
    border-radius: 15px;
    box-shadow: 0 0 20px #00ff6644;
}
h1 {
    color: #ff334b;
}
p {
    color: white;
    font-size: 18px;
    line-height: 2;
}
.name {
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>
<div class="box">
    <h1>⚠️ تحذير هام ⚠️</h1>

    <div class="name">رسالة من أبوصالح البجيري 🔱</div>

    <p>
        انتبه لخصوصيتك!<br>
        احذر من الروابط المجهولة.<br>
        لا تشارك كلمات المرور أو رموز التحقق.<br>
        حافظ على معلوماتك الشخصية.
    </p>

    <h2>🛡️ معلومات مهمة</h2>

    <p>
        الأمان يبدأ بالوعي.<br>
        تحقق من مصدر الرابط قبل فتحه.
    </p>

    <hr>

    <p>
        مع تحياتي<br>
        عبدالله صالح — أبوصالح
    </p>

    <small>درع أبو صالح | صفحة توعوية للأمن الرقمي</small>
</div>
</body>
</html>
